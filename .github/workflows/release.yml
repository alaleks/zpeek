name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            os: linux
            arch: x86_64
            extension: tar.gz
          - target: aarch64-linux-gnu
            os: linux
            arch: aarch64
            extension: tar.gz
          - target: x86_64-macos
            os: macos
            arch: x86_64
            extension: tar.gz
          - target: aarch64-macos
            os: macos
            arch: aarch64
            extension: tar.gz
          - target: x86_64-windows-gnu
            os: windows
            arch: x86_64
            extension: zip
          - target: aarch64-windows-gnu
            os: windows
            arch: aarch64
            extension: zip
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --prefix release-root
      - name: Package
        shell: bash
        run: |
          asset="zpeek-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.extension }}"
          if [[ "${{ matrix.extension }}" == "zip" ]]; then
            (cd release-root/bin && zip "../../${asset}" zpeek.exe)
          else
            tar -czf "$asset" -C release-root/bin zpeek
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zpeek-${{ matrix.os }}-${{ matrix.arch }}
          path: zpeek-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum zpeek-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
